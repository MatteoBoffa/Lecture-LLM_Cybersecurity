[project]
name = "lectures"
version = "0.1.0"
description = "LLMs and Cybersecurity - an executable lecture for Modelli per l'IA, Politecnico di Torino"
readme = "README.md"
authors = [
    { name = "Matteo Boffa", email = "boffa.matteo.97@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "edtrace>=0.1.15",
    "transformers>=5.15.1",
]

[tool.uv]
# A set of lectures, not a library: uv installs the dependencies and does not
# try to build this directory as a package.
package = false

[tool.black]
# edtrace replaces a source line with its rendering only at the line where the
# step was recorded, so a wrapped text(...) call leaks its string as raw source.
line-length = 400
